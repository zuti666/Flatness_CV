prefix: "olora_resnet50_inr_sam_imagenetr_t20_rank16"

memory_size: 0
memory_per_class: 0
fixed_memory: false

#----------- Dataset ----------------
dataset: "imagenetr"

# task divided
class_shuffle: false
init_cls: 10
increment: 10

seed:
  - 0

all_or_inc: inc

#----------- Backbone ----------------
# ResNet-50: out_dim=2048 (Bottleneck, expansion=4)
# ResNet-18: out_dim=512  (BasicBlock, expansion=1)
backbone_type: "resnet50"

# Which ResNet stages to insert LoRA into (0=layer1 .. 3=layer4).
# Default [2,3] = layer3 + layer4 (most semantic, reasonable cost).
# For lighter runs use [3] only; for full adaptation use [0,1,2,3].
lora_layers:
  - 2
  - 3

# GPU used for training
# Set to "0" because CUDA_VISIBLE_DEVICES=0 in the run script (only one GPU visible)
device:
  - "0"

#---------- Method --------
model_name: "olora"
lora_rank: 16

#---------- Train --------
batch_size: 128

optimizer: "sgd"
optimizer_type: "sam"
sam_rho: 0.05
sam_adaptive: false

scheduler: cosine
# First task
init_epoch: 20
init_lr: 0.01
init_momentum: 0
init_weight_decay: 0

# Subsequent tasks
epochs: 20
lrate: 0.01
momentum: 0
weight_decay: 0


#---------------------------- For evaluation ------------------------------------

#-------------- Linear Probe ------------------
linear_probe_eval_num_workers: 0
linear_probe_softmax_joint_seen_eval: true
linear_probe_softmax_per_task_eval: false
probe_train_mode: train
probe_test_mode: test

probe_fit_epochs: 20
probe_fit_lr: 0.015
probe_fit_moment: 0
probe_fit_wd: 0.0005
probe_fit_train_batch_size: 128



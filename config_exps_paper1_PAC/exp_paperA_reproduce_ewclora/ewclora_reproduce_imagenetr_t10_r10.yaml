# Reproduce: EWC-LoRA (Zheng et al., ICLR 2026) on ImageNet-R
# Paper Table 2: A10=72.86±0.79, Avg=78.95±0.86
# Source: Table 8 (Appendix A.2.2)
#   optimizer: Adam (beta1=0.9, beta2=0.99; framework defaults to 0.999)
#   epochs: 50, rank: 10, lr: 0.0005, wd: 0.005
#   batch_size: 128, shuffle: False
#   lambda: 1e7 (empirical Fisher, best for all datasets)
#   gamma (Fisher decay): 1.0 (low-rank-cl actual config; Appendix A.2.2 says 0.9 but code uses 1.0)
#   10 tasks x 20 classes
#
# Implementation note vs paper (low-rank-cl):
#   Paper merges LoRA into backbone after each task (accumulate_and_reset_lora).
#   Our SeqLoRA does NOT merge; instead uses delta_reference snapshot to compute
#   drift penalty F*(DeltaW - DeltaW_ref)^2. Mathematically equivalent intent,
#   but optimizer momentum carries over across tasks in our version.
prefix: reproduce_ewclora_imagenetr_t10_r10

memory_size: 0
memory_per_class: 0
fixed_memory: false

dataset: "imagenetr"
class_shuffle: false
init_cls: 20
increment: 20
nb_tasks: 10
total_sessions: 10

seed:
  - 0
  - 1993
  - 42

all_or_inc: inc
backbone_type: "vit_base_patch16_224"
device:
  - "0"

model_name: "ewclora_youyue_fitarchitecture"
lora_rank: 10

ewc_lambda: 1.0e+07
ewc_gamma: 1.0
ewc_eta: 0.0
ewc_max_batches: 100

batch_size: 128
optimizer: "adam"
optimizer_type: "sgd"

scheduler: "cosine"
init_epoch: 50
init_lr: 0.0005
init_momentum: 0
init_weight_decay: 0.005

epochs: 50
lrate: 0.0005
momentum: 0
weight_decay: 0.005

linear_probe_eval_num_workers: 0
linear_probe_softmax_joint_seen_eval: false
linear_probe_softmax_per_task_eval: false
probe_train_mode: train
probe_test_mode: test
probe_fit_epochs: 20
probe_fit_lr: 0.015
probe_fit_moment: 0
probe_fit_wd: 0.0005
probe_fit_train_batch_size: 128

flat_eval: false
feature_flat_eval: false
feature_cka_eval: false
feature_proto_eval: false
attention_probe_eval: false

# Paper A cross-dataset validation: Layer3 AS^1 + trace-normalized Fisher.
# Training hyperparameters are aligned to exp1_rebuttel_oxfordPet/seqlora_inr_gam_t20c10_r16.yaml.
# The repo's existing OxfordPet config uses dataset: "pets".
prefix: paperA_as1normfisher_lam2000_oxfordpet_t9c4_r16_s0

memory_size: 0
memory_per_class: 0
fixed_memory: false

dataset: "pets"
class_shuffle: false
init_cls: 5
increment: 4
nb_tasks: 9
total_sessions: 9

seed:
  - 0

all_or_inc: inc
backbone_type: "vit_base_patch16_224"
device:
  - "0"

model_name: "ewclora_normfisher_gam"
lora_rank: 16

lambda_flat: 1.0
ewc_lambda: 2000
ewc_gamma: 1.0
ewc_eta: 0.0
ewc_max_batches: 100
ewc_normalize_fisher: true
ewc_fisher_norm_eps: 1.0e-12
ewc_dual_ascent: false

mechanism_eval: true
mechanism_grad_stats: true
mechanism_top_fraction: 0.1
mechanism_eps: 1.0e-12

batch_size: 128
optimizer: "sgd"
optimizer_type: "gam"

scheduler: "cosine"
init_epoch: 40
init_lr: 0.0025
init_momentum: 0
init_weight_decay: 0

epochs: 40
lrate: 0.0025
momentum: 0
weight_decay: 0

linear_probe_eval_num_workers: 0
linear_probe_softmax_joint_seen_eval: false
linear_probe_softmax_per_task_eval: false
probe_train_mode: train
probe_test_mode: test
probe_fit_epochs: 20
probe_fit_lr: 0.015
probe_fit_moment: 0
probe_fit_wd: 0.0005
probe_fit_train_batch_size: 128

flat_eval: false
feature_flat_eval: false
feature_cka_eval: false
feature_proto_eval: false
attention_probe_eval: false

# Baseline: EWC_Yaoyue_LoRA without GAM/AS^1.
# Training hyperparameters aligned to existing Cars196 LoRA/GAM baseline.
prefix: paperA_ewc_yaoyue_sgd_cars196_t10c20_r16_s0

memory_size: 0
memory_per_class: 0
fixed_memory: false

dataset: "cars196"
class_shuffle: false
init_cls: 16
increment: 20
nb_tasks: 10
total_sessions: 10

seed:
  - 0

all_or_inc: inc
backbone_type: "vit_base_patch16_224"
device:
  - "0"

model_name: "ewc_yaoyue_lora_liying"
lora_rank: 16

ewc_lambda: 20.0
ewc_gamma: 1.0
ewc_max_batches: 100
ewc_eps: 1.0e-5

batch_size: 128
optimizer: "sgd"
optimizer_type: "sgd"

scheduler: "cosine"
init_epoch: 40
init_lr: 0.05
init_momentum: 0
init_weight_decay: 0

epochs: 40
lrate: 0.05
momentum: 0
weight_decay: 0

linear_probe_eval_num_workers: 0
linear_probe_softmax_joint_seen_eval: false
linear_probe_softmax_per_task_eval: false
probe_train_mode: train
probe_test_mode: test
probe_fit_epochs: 20
probe_fit_lr: 0.015
probe_fit_moment: 0
probe_fit_wd: 0.0005
probe_fit_train_batch_size: 128

flat_eval: false
feature_flat_eval: false
feature_cka_eval: false
feature_proto_eval: false
attention_probe_eval: false

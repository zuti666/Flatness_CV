prefix: "olora_inr_gam_het5_t5_rank16_lr002_epoch40"

memory_size: 0
memory_per_class: 0
fixed_memory: false

#----------- Dataset ----------------
dataset: "het5"

# task divided: 5 tasks, one dataset per task (CUB/Aircraft/Cars196/Flowers102/OxfordPet)
class_shuffle: false
init_cls: 200
increment: 1
nb_tasks: 5
total_sessions: 5

seed:
  - 0
  # - 1993
  # - 1024
  # - 42
  # - 521

all_or_inc: inc

backbone_type: "vit_base_patch16_224"

# GPU used for training
device:
- '0'

lora_rank: 16

#---------- Method --------
model_name: "olora"

batch_size: 128

optimizer: "sgd"
scheduler: cosine
init_epoch: 40
init_lr: 0.02
init_momentum: 0
init_weight_decay: 0

epochs: 40
lrate: 0.02
momentum: 0
weight_decay: 0
# optimizer
optimizer_type: "gam"


#---------------------------- For evaluation ------------------------------------

#-------------- # Linear Probe Evaluation , False------------------
linear_probe_eval_num_workers: 0
linear_probe_softmax_joint_seen_eval: false
linear_probe_softmax_per_task_eval: false
probe_train_mode: train
probe_test_mode: test

probe_fit_epochs: 20
probe_fit_lr: 0.015
probe_fit_moment: 0
probe_fit_wd: 0.0005
probe_fit_train_batch_size: 128


flat_eval: false
flat_eval_sharpness: true
flat_eval_hessian: true
flat_eval_GGN: true
flat_eval_fisher: true

flat_eval_batch_size: 32
flat_eval_dataset_fraction: 0.1
flat_eval_sharpness_radius: 0.05
flat_eval_esh_gaussian_std: null
flat_eval_esh_samples: 100

eval_hessian: true
flat_eval_task_indices: "-1"
feature_flat_task_indices: "-1"

flat_eval_hessian_power_iters: 50
flat_eval_hessian_trace_samples: 50

weight_loss_land_1d: false
weight_loss_land_2d: false
weight_loss_land_radius: 1
weight_loss_land_num_points: 41
weight_loss_land_filter_norm: false
loss_land_modes: "full"
loss_land_basis: "random"
eig_save_vectors: false

feature_flat_eval: false
feature_flat_topk: 200
feature_flat_eps: 1e-12
feature_flat_rank_tol: 1e-06
feature_flat_save_path: null

feature_cka_eval: false
feature_cka_max_batches: 32
feature_cka_max_samples: 2048
feature_sep_max_samples: 2048
feature_margin_max_samples: 4096

feature_proto_eval: false
feature_proto_max_batches: 32
feature_proto_max_samples: 2048

attention_probe_eval: false

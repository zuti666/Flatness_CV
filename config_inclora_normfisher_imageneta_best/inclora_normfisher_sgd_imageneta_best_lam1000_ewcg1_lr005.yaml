# IncLoRA + normalized-Fisher EWC, plain SGD (no GAM).
# Purpose: isolate Fisher-protection effect vs GAM variant.
# Same ewc_lambda/ewc_gamma/lrate as the GAM reference run (gpu3/gpu32).
outputs_root: "outputs_logs/config_inclora_normfisher_imageneta_best"
prefix: inclora_fs_lam1000_ewcg1_imageneta_t10c20_r10_sgd_lr005_e20_s0

memory_size: 0
memory_per_class: 0
fixed_memory: false

dataset: "imageneta"
class_shuffle: false
init_cls: 20
increment: 20
nb_tasks: 10
total_sessions: 10

seed:
  - 0

all_or_inc: inc
backbone_type: "vit_base_patch16_224"
device:
  - "0"

model_name: "inclora_normfisher_gam"
lora_rank: 10

lambda_flat: 1.0
ewc_lambda: 1000
ewc_gamma: 1
ewc_eta: 0.0
ewc_max_batches: 100
ewc_normalize_fisher: true
ewc_fisher_norm_eps: 1.0e-12
ewc_dual_ascent: false

mechanism_eval: true
mechanism_grad_stats: true
mechanism_top_fraction: 0.1
mechanism_eps: 1.0e-12
kl_diag_sigma2: 1.0

batch_size: 128
optimizer: "sgd"
optimizer_type: "sgd"
optimizer_tag_override: "sgd_lr005_e20"

scheduler: "cosine"
init_epoch: 20
init_lr: 0.05
init_momentum: 0
init_weight_decay: 0.0

epochs: 20
lrate: 0.05
momentum: 0
weight_decay: 0.0

linear_probe_eval_num_workers: 0
linear_probe_softmax_joint_seen_eval: false
linear_probe_softmax_per_task_eval: false
probe_train_mode: train
probe_test_mode: test
probe_fit_epochs: 20
probe_fit_lr: 0.015
probe_fit_moment: 0
probe_fit_wd: 0.0005
probe_fit_train_batch_size: 128

flat_eval: false
feature_flat_eval: false
feature_cka_eval: false
feature_proto_eval: false
attention_probe_eval: false

prefix: "infobudget_gam_lora_imagenetr_t20_rank16_memsource_memory_drift_only_1993"

memory_size: 200
memory_per_class: 0
fixed_memory: false

dataset: "imagenetr"
class_shuffle: true
init_cls: 10
increment: 10
nb_tasks: 20
total_sessions: 20

seed:
  - 1993

all_or_inc: inc
backbone_type: "vit_base_patch16_224"

device:
  - "7"

model_name: "infobudget_gam_lora"
lora_rank: 16

batch_size: 128
optimizer: "sgd"
optimizer_type: "gam"

scheduler: cosine
init_epoch: 20
init_lr: 0.01
init_momentum: 0
init_weight_decay: 0
epochs: 20
lrate: 0.01
momentum: 0
weight_decay: 0

gam_adaptive: false
gam_grad_reduce: "mean"
gam_perturb_eps: 1e-12
gam_grad_rho: 0.2
gam_grad_norm_rho: 0.2
gam_grad_beta_1: 1.0
gam_grad_beta_2: 1.0
gam_grad_beta_3: 1.0
gam_grad_gamma: 0.1

ibg_enable: true
ibg_use_projection: false
ibg_use_drift_penalty: true
ibg_track_mechanism: true

ibg_topk: 16
ibg_max_batches: 4
ibg_tau_h: 1e-4
ibg_tau_y: 1e-6
ibg_eps: 1e-12
ibg_basis_cap: 128
ibg_random_subspace: false
ibg_shuffle_labels_subspace: false
ibg_whiten_h: true
ibg_whiten_y: true

ibg_probe_batches: 2
ibg_probe_topk: 8
ibg_proj_basis_cap: 64
ibg_random_protection_basis: false
ibg_save_json: true
ibg_prot_stat: "energy"
ibg_track_old_acc: true

# ---- old-data source ----
ibg_mem_source: "memory"
ibg_mem_fallback_train: false
ibg_mem_batch_size: 128

# ---- eval toggles ----
flat_eval: false
feature_flat_eval: true
feature_cka_eval: true
feature_proto_eval: true
feature_drift_eval: true
attention_probe_eval: false
linear_probe_softmax_joint_seen_eval: false
linear_probe_softmax_per_task_eval: false

save_final_model: false

experiment_name: rotated_mnist_gam_exact_key
device: cuda

data:
  name: rotated_mnist
  root: data
  download: true
  num_tasks: 5
  rotation_span: 120
  train_subset: 10000
  test_subset: 2000
  num_workers: 4

model:
  activation: softplus
  parameterization: factor_lora
  rank: 4
  lora_alpha: rank
  lifecycle: persistent

base:
  checkpoint: checkpoints/mnist_mlp_softplus_h32_seed3407.pt
  epochs: 10

training:
  epochs_per_task: 5
  batch_size: 128
  optimizer: sgd
  lr: 0.03
  momentum: 0.0
  gam_radius: 0.01
  gam_weight: 0.05

diagnostics:
  enabled: true
  max_samples_per_task: 128
  pathwise: true
  path_granularity: epoch
  hvp_fd_radii: [0.03, 0.01, 0.003]
  hessian_lanczos_steps: 12
  geometry_enabled: true
  geometry_immediate_only: true

grid:
  parameterizations: [dense, factor_lora]
  ranks: [4]
  lifecycles: [persistent]
  optimizers: [sgd, gam_fd, gam_exact]
  rotation_spans: [120]
  seeds: [0, 1, 2]

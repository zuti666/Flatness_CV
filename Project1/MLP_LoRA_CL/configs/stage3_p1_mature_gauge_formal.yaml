experiment_name: stage3_p1_mature_gauge_formal
device: cuda
output_root: outputs
deterministic: true

data:
  name: rotated_mnist
  root: data
  download: true
  num_tasks: 2
  angles: [-30, 30]
  rotation_span: 60
  train_subset: 10000
  test_subset: 2000
  num_workers: 0

model:
  input_dim: 784
  hidden_dim: 32
  num_classes: 10
  activation: gelu
  parameterization: factor_lora
  rank: 4
  lora_alpha: rank
  factor_gauge_scale: 1.0
  subspace_seed: run_seed

base:
  mode: pretrained_mnist
  checkpoint: checkpoints/mnist_mlp_gelu_h32_angle0_seed3407.pt
  pretrain_angle: 0.0
  seed: 3407
  epochs: 10
  batch_size: 256
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0

training:
  batch_size: 128
  lr: 0.1
  momentum: 0.0
  weight_decay: 0.0
  sam_rho: 0.005
  perturbation_metric: effective_weight
  grad_clip: null

diagnostics:
  enabled: true
  max_samples_per_task: 128
  pathwise: true

mature_gauge:
  task_a_epochs: 5
  task_a_lr: 0.01
  task_a_momentum: 0.9
  warmup_epochs: 1
  continuation_epochs: 4
  task_b_lr: 0.1
  task_b_momentum: 0.0
  continuation_methods: [sgd, sam]
  # Locked from the pilot by the conservative pre-rule: if both radii preserve
  # current-task loss and effective drift, use the smaller nonzero radius.
  sam_radii: [0.005]
  transformations:
    - identity
    - scalar_0.5
    - scalar_2
    - orthogonal
    - anisotropic_2
    - anisotropic_4
  diagnostic_radius: 0.005
  gauge_seed_offset: 70000
  task_a_loader_seed_offset: 1000
  warmup_loader_seed_offset: 2000
  continuation_loader_seed_offset: 3000

grid:
  angle_pairs:
    - [-30, 30]
    - [45, -45]
  seeds: [600, 601, 602, 603, 604, 605, 606, 607, 608, 609,
          610, 611, 612, 613, 614, 615, 616, 617, 618, 619]

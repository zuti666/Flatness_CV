experiment_name: stage3_p2c_every_step_taylor
device: cuda
output_root: outputs
deterministic: true

data:
  name: rotated_mnist
  root: data
  download: true
  num_tasks: 2
  angles: [45, -45]
  rotation_span: 60
  train_subset: 10000
  test_subset: 2000
  num_workers: 0

model:
  input_dim: 784
  hidden_dim: 32
  num_classes: 10
  activation: gelu
  parameterization: factor_lora
  rank: 4
  lora_alpha: rank
  factor_gauge_scale: 1.0
  subspace_seed: run_seed

base:
  mode: pretrained_mnist
  checkpoint: checkpoints/mnist_mlp_gelu_h32_angle0_seed3407.pt
  pretrain_angle: 0.0
  seed: 3407
  epochs: 10
  batch_size: 256
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0

training:
  batch_size: 128
  lr: 0.1
  momentum: 0.0
  weight_decay: 0.0
  sam_rho: 0.005
  perturbation_metric: effective_weight
  grad_clip: null

diagnostics:
  enabled: true
  max_samples_per_task: 128
  num_nonoverlap_batches: 1
  pathwise: true

mature_gauge:
  task_a_epochs: 5
  task_a_lr: 0.01
  task_a_momentum: 0.9
  warmup_epochs: 1
  continuation_epochs: 4
  task_b_lr: 0.1
  task_b_momentum: 0.0
  continuation_methods: [sgd, sam]
  sam_radii: [0.005]
  transformations:
    - identity
    - scalar_0.5
    - scalar_2
  diagnostic_radius: 0.005
  dynamic_diagnostics: false
  pathwise_checkpoint_interval_steps: 1
  gauge_seed_offset: 70000
  task_a_loader_seed_offset: 1000
  warmup_loader_seed_offset: 2000
  continuation_loader_seed_offset: 3000

grid:
  angle_pairs:
    - [45, -45]
  # Deliberately replay P2b seeds: this is a within-trajectory resolution
  # audit, not an independent replication cohort.
  seeds: [705, 706, 707]

experiment_name: focus_stage1b_sam_robustness_reverse
device: cuda
output_root: outputs

data:
  name: rotated_mnist
  root: data
  download: true
  num_tasks: 5
  angles: [60, 45, 30, 15, 0]
  rotation_span: 60
  train_subset: 10000
  test_subset: 2000
  num_workers: 0

model:
  input_dim: 784
  hidden_dim: 64
  num_classes: 10
  activation: gelu
  parameterization: factor_lora
  rank: 4
  lora_alpha: rank
  lifecycle: persistent

base:
  mode: pretrained_mnist
  checkpoint: checkpoints/mnist_mlp_gelu_h64_angle-30_seed3407.pt
  pretrain_angle: -30.0
  seed: 3407
  epochs: 10
  batch_size: 256
  lr: 0.05
  momentum: 0.9

training:
  epochs_per_task: 5
  batch_size: 128
  optimizer: sgd
  lr: 0.03
  momentum: 0.9
  weight_decay: 0.0
  sam_rho: 0.02
  gam_radius: 0.02
  gam_weight: 0.05
  perturbation_metric: effective_weight

diagnostics:
  enabled: false
  trajectory_eval: true
  pathwise: false
  geometry_enabled: false
  hessian_lanczos_steps: 0

grid:
  parameterizations: [dense, factor_lora]
  ranks: [4]
  optimizers: [sgd, sam]
  learning_rates: [0.01, 0.03, 0.1]
  sam_radii: [0.005, 0.02, 0.05]
  seeds: [0, 1, 2, 3, 4]

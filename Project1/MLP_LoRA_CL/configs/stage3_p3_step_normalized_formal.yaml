experiment_name: stage3_p3_step_normalized_formal
device: cuda
output_root: outputs
deterministic: true

data:
  name: rotated_mnist
  root: data
  download: true
  num_tasks: 2
  angles: [-30, 30]
  rotation_span: 60
  train_subset: 10000
  test_subset: 2000
  num_workers: 0

model:
  input_dim: 784
  hidden_dim: 32
  num_classes: 10
  activation: gelu
  parameterization: factor_lora
  rank: 4
  lora_alpha: rank
  factor_gauge_scale: 1.0
  subspace_seed: run_seed

base:
  mode: pretrained_mnist
  checkpoint: checkpoints/mnist_mlp_gelu_h32_angle0_seed3407.pt
  pretrain_angle: 0.0
  seed: 3407
  epochs: 10
  batch_size: 256
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0

training:
  batch_size: 128
  lr: 0.1
  momentum: 0.0
  weight_decay: 0.0
  sam_rho: 0.005
  perturbation_metric: effective_weight
  grad_clip: null

diagnostics:
  enabled: true
  max_samples_per_task: 128
  num_nonoverlap_batches: 2
  pathwise: true

mature_gauge:
  task_a_epochs: 5
  task_a_lr: 0.01
  task_a_momentum: 0.9
  warmup_epochs: 1
  continuation_epochs: 4
  task_b_lr: 0.1
  task_b_momentum: 0.0
  continuation_methods: [sgd, sam]
  sam_radii: [0.005]
  transformations:
    - identity
    - orthogonal
    - scalar_0.5
    - scalar_2
    - anisotropic_4
  gauge_seed_offset: 70000
  task_a_loader_seed_offset: 1000
  warmup_loader_seed_offset: 2000
  continuation_loader_seed_offset: 3000

step_normalization:
  # q=1 was selected by the frozen numerical/locality rules on seeds 800--804.
  target_profile: configs/stage3_p3_target_profiles.json
  pilot_scales: [1.0]
  maximum_alpha: 64.0
  progress_interval_steps: 5
  direction_diagnostic_interval_steps: 20
  counterfactual_interval_steps: 20
  progress_batch_size: 2000
  selection_rules:
    maximum_target_relative_error: 1.0e-5
    maximum_candidate_closure_error: 5.0e-5
    maximum_alpha: 16.0
    minimum_raw_to_resolved_cosine: 0.995
    maximum_counterfactual_median_abs_taylor_residual: 0.01
    maximum_counterfactual_p90_abs_taylor_residual: 0.03
    minimum_identity_progress_support_width: 0.05

formal_inference:
  # Frozen before seeds 820--839. The +/-0.001 progress-AUC equivalence
  # margin is approximately half the smallest robust non-orthogonal
  # current-loss interaction in the independent P1 formal cohort.
  progress_auc_interaction_equivalence_margin: 0.001
  equivalence_ci_level: 0.90
  selected_target_scale: 1.0
  primary_metric: progress_auc_sam_benefit
  secondary_metric: path_auc_sam_benefit
  descriptive_metric: endpoint_sam_benefit
  independent_unit: seed

grid:
  angle_pairs:
    - [-30, 30]
    - [45, -45]
    - [30, -30]
  seeds:
    - 820
    - 821
    - 822
    - 823
    - 824
    - 825
    - 826
    - 827
    - 828
    - 829
    - 830
    - 831
    - 832
    - 833
    - 834
    - 835
    - 836
    - 837
    - 838
    - 839

# D1: DomainNet, current best LR with stronger EWC memory and mass-matched lambda.
outputs_root: "outputs_logs/config_Expand_cifar_domainnet_c1d2"
prefix: as1normfisher_lam1600_ewcg095_domainnet_t5c69_r30_sgd_initlr0p05_lr0p05_e5_rho005_nr01_g01_d1_s0

memory_size: 0
memory_per_class: 0
fixed_memory: false

dataset: "domainnet"
data_path: "/data/115-1/datasets/domainnet"
domainnet_split_dir: "dataloaders/splits"
class_shuffle: false
init_cls: 69
increment: 69
nb_tasks: 5
total_sessions: 5

seed:
  - 0

all_or_inc: inc
backbone_type: "vit_base_patch16_224"
device:
  - "0"

model_name: "ewclora_normfisher_gam"
lora_rank: 30

lambda_flat: 1.0
ewc_lambda: 1600
ewc_gamma: 0.95
ewc_eta: 0.0
ewc_max_batches: 100
ewc_normalize_fisher: true
ewc_fisher_norm_eps: 1.0e-12
ewc_dual_ascent: false

mechanism_eval: true
mechanism_grad_stats: true
mechanism_top_fraction: 0.1
mechanism_eps: 1.0e-12

batch_size: 128
optimizer: "sgd"
gam_base_optimizer: "sgd"
optimizer_type: "gam"
optimizer_tag_override: "gam_sgd_initlr0p05_lr0p05_e5_rho005_nr01_g01_ewcg095_lam1600_d1"
gam_adaptive: false
gam_grad_beta_1: 1.0
gam_grad_beta_2: 1.0
gam_grad_beta_3: 1.0
gam_grad_gamma: 0.1
gam_grad_rho: 0.05
gam_grad_norm_rho: 0.1

scheduler: "cosine"
init_epoch: 5
init_lr: 0.05
init_momentum: 0
init_weight_decay: 0.0

epochs: 5
lrate: 0.05
momentum: 0
weight_decay: 0.0

linear_probe_eval_num_workers: 0
linear_probe_softmax_joint_seen_eval: false
linear_probe_softmax_per_task_eval: false
probe_train_mode: train
probe_test_mode: test
probe_fit_epochs: 20
probe_fit_lr: 0.015
probe_fit_moment: 0
probe_fit_wd: 0.0005
probe_fit_train_batch_size: 128

flat_eval: false
feature_flat_eval: false
feature_cka_eval: false
feature_proto_eval: false
attention_probe_eval: false
